name: Qualify an OpenWrt maintenance proposal
on:
  workflow_call:
    inputs:
      stage:
        type: string
        required: true
    secrets:
      OPENCODE_API_KEY:
        required: true
permissions:
  contents: read
jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      patch_sha: ${{ steps.proposal.outputs.sha }}
      metric: ${{ steps.proposal.outputs.metric }}
      scope: ${{ steps.proposal.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - run: python3 .github/scripts/check_repository.py
      - uses: ./.github/actions/setup-opencode
      - id: proposal
        env:
          STAGE: ${{ inputs.stage }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: python3 .github/scripts/maintenance.py "$STAGE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: maintenance-${{ inputs.stage }}-proposal
          path: ${{ runner.temp }}/maintenance-review/
          if-no-files-found: ignore
          retention-days: 14
  qualify:
    needs: propose
    if: needs.propose.outputs.patch_sha != ''
    uses: ./.github/workflows/sdk-build.yml
    with:
      update_patch_sha: ${{ needs.propose.outputs.patch_sha }}
      patch_artifact: maintenance-${{ inputs.stage }}-proposal
      apk_artifact: maintenance-${{ inputs.stage }}-apks
      candidate_kind: maintenance
      metric: ${{ needs.propose.outputs.metric }}
      scope: ${{ needs.propose.outputs.scope }}
