name: Update upstream versions

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      preview:
        description: Build proposed changes without pushing them
        type: boolean
        default: true
      maintenance:
        description: Run the maintenance preview
        type: boolean
        default: false
      replay:
        description: Qualify the current pinned source of a package in preview
        type: choice
        options: [none, protun-openwrt, tailscale-rs]
        default: none
      opencode_smoke:
        description: Verify the locked CLI and model on an isolated text fixture only
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch' && inputs.preview
        && format('openwrt-preview-{0}-{1}-{2}-{3}', github.ref, inputs.replay, inputs.maintenance, inputs.opencode_smoke)
        || 'update-upstream-versions' }}
  cancel-in-progress: false

jobs:
  maintenance-preview:
    if: github.event_name == 'workflow_dispatch' && inputs.preview && inputs.maintenance
    uses: ./.github/workflows/maintenance.yml
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
  opencode-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.preview && inputs.opencode_smoke && !inputs.maintenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: ./.github/actions/setup-opencode
      - env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: python .github/scripts/opencode_smoke.py
  update:
    if: ${{ !inputs.maintenance && !inputs.opencode_smoke && (inputs.replay == '' || inputs.replay == 'none' || inputs.preview) && (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.preview)) && inputs.replay != 'tailscale-rs' }}
    uses: ./.github/workflows/upstream-candidate.yml
    with:
      lane: standard
      replay: ${{ inputs.replay }}
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

  update-tailscale:
    if: ${{ !inputs.maintenance && !inputs.opencode_smoke && (inputs.replay == '' || inputs.replay == 'none' || inputs.preview) && (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.preview)) && (inputs.replay == '' || inputs.replay == 'none' || inputs.replay == 'tailscale-rs') }}
    uses: ./.github/workflows/upstream-candidate.yml
    with:
      lane: tailscale
      replay: ${{ inputs.replay }}
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

  qualify:
    needs: update
    if: needs.update.outputs.patch_sha != ''
    permissions:
      contents: read
    uses: ./.github/workflows/sdk-build.yml
    with:
      update_patch_sha: ${{ needs.update.outputs.patch_sha }}
      patch_artifact: proposed-upstream-standard
      apk_artifact: qualified-upstream-apks
      warm_rebuild: ${{ inputs.replay != '' && inputs.replay != 'none' }}

  qualify-tailscale:
    needs: update-tailscale
    if: needs.update-tailscale.outputs.patch_sha != ''
    uses: ./.github/workflows/sdk-build.yml
    with:
      update_patch_sha: ${{ needs.update-tailscale.outputs.patch_sha }}
      patch_artifact: proposed-upstream-tailscale
      apk_artifact: qualified-tailscale-apks
      warm_rebuild: ${{ inputs.replay == 'tailscale-rs' }}

  publish:
    needs: [update, qualify]
    if: needs.qualify.result == 'success' && needs.update.outputs.patch_sha != '' && github.ref == 'refs/heads/main' && needs.update.outputs.review_required != 'true' && !(github.event_name == 'workflow_dispatch' && inputs.preview)
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          token: ${{ secrets.UPSTREAM_UPDATE_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: proposed-upstream-standard
          path: ${{ runner.temp }}/upstream-update
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qualified-upstream-apks
          path: ${{ runner.temp }}/qualified-upstream
      - name: Publish the exact change that passed the OpenWrt SDK gate
        shell: bash
        env:
          PATCH_SHA: ${{ needs.update.outputs.patch_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/qualified-upstream"
          test "$(sed -n '1p' provenance.txt)" = "$GITHUB_SHA"
          test "$(sed -n '2p' provenance.txt)" = "$PATCH_SHA"
          diff <(tail -n +3 provenance.txt) <(sha256sum -- *.apk)
          cd "$GITHUB_WORKSPACE"
          git fetch --no-tags origin refs/heads/main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          bash .github/scripts/apply-update.sh "$RUNNER_TEMP/upstream-update/update.patch" "$PATCH_SHA" "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update upstream versions'
          bash .github/scripts/push-qualified.sh main
