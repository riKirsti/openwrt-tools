name: Update upstream versions

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      preview:
        description: Build proposed changes without pushing them
        type: boolean
        default: true
      maintenance:
        description: Run the maintenance preview
        type: boolean
        default: false
      replay:
        description: Qualify the current pinned source of a package in preview
        type: choice
        options: [none, protun-openwrt, tailscale-rs]
        default: none
      opencode_smoke:
        description: Verify the locked CLI and model on an isolated text fixture only
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ inputs.opencode_smoke && 'openwrt-opencode-smoke' || 'update-upstream-versions' }}
  cancel-in-progress: false

jobs:
  maintenance-preview:
    if: github.event_name == 'workflow_dispatch' && inputs.preview && inputs.maintenance
    uses: ./.github/workflows/maintenance.yml
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
  opencode-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.preview && inputs.opencode_smoke && !inputs.maintenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: ./.github/actions/setup-opencode
      - env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: python .github/scripts/opencode_smoke.py
  update:
    if: "!inputs.maintenance && !inputs.opencode_smoke && (inputs.replay == '' || inputs.replay == 'none' || inputs.preview) && (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.preview))"
    runs-on: ubuntu-latest
    outputs:
      patch_sha: ${{ steps.candidate.outputs.sha }}
      review_required: ${{ steps.candidate.outputs.review_required }}
    steps:
      - name: Checkout the proposed baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python for the version updater
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Run updater tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Install the pinned Rust toolchain
        id: rust
        shell: bash
        run: |
          rust_version=$(sed -n 's/^      RUST_VERSION: //p' .github/workflows/sdk-build.yml)
          if [[ ! $rust_version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Cannot read the pinned Rust version from sdk-build.yml' >&2
            exit 1
          fi
          rustup toolchain install "$rust_version" --profile minimal --no-self-update
          echo "version=$rust_version" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-opencode

      - name: Check upstream versions and prepare a candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RUSTUP_TOOLCHAIN: ${{ steps.rust.outputs.version }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          REPLAY: ${{ inputs.replay }}
        shell: bash
        run: |
          args=()
          if [[ "$REPLAY" != '' && "$REPLAY" != none ]]; then
            args=(--replay "$REPLAY")
          fi
          python3 .github/scripts/update-versions.py "${args[@]}"

      - name: Record the exact update for qualification
        id: candidate
        shell: bash
        run: |
          git add -- 'package/*/Makefile' 'package/*/files/Cargo.lock' \
            package/protun-openwrt/files/openwrt-{client,config,cache,status}.rs \
            package/tailscale-rs/example.c package/tailscale-rs/files/stage-header.py \
            .github/workflows/sdk-build.yml
          if git diff --cached --quiet; then
            echo 'Upstream versions are already current'
            exit 0
          fi
          git diff --cached --check
          python3 .github/scripts/check_repository.py
          python3 .github/scripts/validate-candidate.py upstream
          if git diff --cached -- package/tailscale-rs/Makefile | grep '^+PKG_VERSION:=' >/dev/null; then
            echo 'review_required=true' >> "$GITHUB_OUTPUT"
            echo 'Review the Tailscale Rust release changes in a pull request using the proposed patch artifact.' >> "$GITHUB_STEP_SUMMARY"
          fi
          mkdir -p "$RUNNER_TEMP/upstream-update"
          git diff --cached --binary > "$RUNNER_TEMP/upstream-update/update.patch"
          echo "sha=$(sha256sum "$RUNNER_TEMP/upstream-update/update.patch" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.candidate.outputs.sha != ''
        with:
          name: proposed-upstream-update
          path: ${{ runner.temp }}/upstream-update/update.patch
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.candidate.outputs.sha != ''
        with:
          name: upstream-release-review
          path: ${{ runner.temp }}/*-release-review.md
          if-no-files-found: ignore
          retention-days: 14

  qualify:
    needs: update
    if: needs.update.outputs.patch_sha != ''
    permissions:
      contents: read
    uses: ./.github/workflows/sdk-build.yml
    with:
      update_patch_sha: ${{ needs.update.outputs.patch_sha }}
      apk_artifact: qualified-upstream-apks
      warm_rebuild: ${{ inputs.replay != '' && inputs.replay != 'none' }}

  publish:
    needs: [update, qualify]
    if: needs.qualify.result == 'success' && needs.update.outputs.patch_sha != '' && github.ref == 'refs/heads/main' && needs.update.outputs.review_required != 'true' && !(github.event_name == 'workflow_dispatch' && inputs.preview)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          token: ${{ secrets.UPSTREAM_UPDATE_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: proposed-upstream-update
          path: ${{ runner.temp }}/upstream-update
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qualified-upstream-apks
          path: ${{ runner.temp }}/qualified-upstream
      - name: Publish the exact change that passed the OpenWrt SDK gate
        shell: bash
        env:
          PATCH_SHA: ${{ needs.update.outputs.patch_sha }}
        run: |
          cd "$RUNNER_TEMP/qualified-upstream"
          test "$(sed -n '1p' provenance.txt)" = "$GITHUB_SHA"
          test "$(sed -n '2p' provenance.txt)" = "$PATCH_SHA"
          diff <(tail -n +3 provenance.txt) <(sha256sum -- *.apk)
          cd "$GITHUB_WORKSPACE"
          git fetch --no-tags origin refs/heads/main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          bash .github/scripts/apply-update.sh "$RUNNER_TEMP/upstream-update/update.patch" "$PATCH_SHA" "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update upstream versions'
          git push origin HEAD:refs/heads/main
