name: Compare controller setup and repair
on:
  workflow_dispatch:
    inputs:
      baseline:
        required: true
        type: string
      candidate:
        required: true
        type: string
permissions:
  contents: read
jobs:
  pair:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      BASELINE: ${{ inputs.baseline }}
      CANDIDATE: ${{ inputs.candidate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Time the exact controller scripts with the same synthetic host fixture
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASELINE" =~ ^[0-9a-f]{40}$ && "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$BASELINE" "$CANDIDATE"
          git worktree add --detach "$RUNNER_TEMP/baseline" "$BASELINE"
          git worktree add --detach "$RUNNER_TEMP/candidate" "$CANDIDATE"
          python3 .github/scripts/measure-controller.py "$RUNNER_TEMP/baseline" "$RUNNER_TEMP/candidate" | tee controller-timing.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: controller-timing
          path: controller-timing.json
          if-no-files-found: error
