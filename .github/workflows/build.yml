name: Build OpenWrt tools APKs

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - proton-stealth-integration
    paths:
      - '.github/workflows/build.yml'
      - '.github/workflows/sdk-build.yml'
      - '.github/scripts/**'
      - 'package/**'
      - '.gitattributes'

permissions:
  contents: read

concurrency:
  group: build-openwrt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'proton-stealth-integration' || github.event.pull_request.head.repo.full_name != github.repository
    permissions:
      contents: read
    uses: ./.github/workflows/sdk-build.yml
    with:
      apk_artifact: openwrt-tools-${{ github.sha }}

  publish:
    needs: build
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/proton-stealth-integration') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the built commit for publishing
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openwrt-tools-${{ github.sha }}
          path: ${{ runner.temp }}/tools-apk

      - name: Commit APKs to build folder
        shell: bash
        env:
          APK_DIR: ${{ runner.temp }}/tools-apk
          PUBLISH_BRANCH: ${{ github.ref_name }}
        run: |
          cd "$APK_DIR"
          test "$(sed -n '1p' provenance.txt)" = "$GITHUB_SHA"
          test -z "$(sed -n '2p' provenance.txt)"
          diff <(tail -n +3 provenance.txt) <(sha256sum -- *.apk)
          cd "$GITHUB_WORKSPACE"
          bash .github/scripts/publish-apks.sh
