name: Build OpenWrt tools APKs

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build.yml'
      - '.github/scripts/build-sdk.sh'
      - '.github/scripts/load-library.c'
      - '.github/scripts/publish-apks.sh'
      - 'package/**'
      - '.gitattributes'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SDK_ARCH: aarch64_cortex-a53-25.12.6
      PACKAGES_COMMIT: 093d551675b1119a06ef224d419905e8d6b2af1a
      RUST_VERSION: 1.99.1
      TOOLS_BUILD_MODE: runtime

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install prebuilt Rust and the ARM64 musl standard library
        id: rust
        shell: bash
        run: |
          started=$SECONDS
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup target add aarch64-unknown-linux-musl --toolchain "$RUST_VERSION"
          toolchain_dir=$(rustc +"$RUST_VERSION" --print sysroot)
          echo "toolchain-dir=$toolchain_dir" >> "$GITHUB_OUTPUT"
          echo "Rust setup: $((SECONDS - started))s" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve the OpenWrt SDK image
        id: sdk
        shell: bash
        run: |
          started=$SECONDS
          sdk_image="ghcr.io/openwrt/sdk:$SDK_ARCH"
          docker pull "$sdk_image"
          image_id=$(docker image inspect --format '{{.Id}}' "$sdk_image")
          echo "image-id=${image_id#sha256:}" >> "$GITHUB_OUTPUT"
          image_ref=$(docker image inspect --format '{{index .RepoDigests 0}}' "$sdk_image")
          echo "image-ref=$image_ref" >> "$GITHUB_OUTPUT"
          echo "SDK image setup: $((SECONDS - started))s" >> "$GITHUB_STEP_SUMMARY"

      - name: Restore SDK downloads and Rust build files
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/tools-cache/downloads
            ${{ runner.temp }}/tools-cache/cargo-target
          key: tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.SDK_ARCH }}-${{ steps.sdk.outputs.image-id }}-${{ env.PACKAGES_COMMIT }}-${{ env.RUST_VERSION }}-mode${{ env.TOOLS_BUILD_MODE }}-${{ hashFiles('package/**', '.github/scripts/build-sdk.sh') }}
          restore-keys: |
            tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.SDK_ARCH }}-${{ steps.sdk.outputs.image-id }}-${{ env.PACKAGES_COMMIT }}-${{ env.RUST_VERSION }}-mode${{ env.TOOLS_BUILD_MODE }}-

      - name: Enable ARM64 library load checks
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Build and verify all three packages with the OpenWrt SDK
        id: build
        shell: bash
        env:
          RESOLVED_SDK_IMAGE: ${{ steps.sdk.outputs.image-ref }}
          RUST_TOOLCHAIN_DIR: ${{ steps.rust.outputs.toolchain-dir }}
        run: |
          started=$SECONDS
          BUILD_JOBS=$(nproc)
          export BUILD_JOBS
          echo "Build jobs: $BUILD_JOBS; build mode: $TOOLS_BUILD_MODE"
          echo "Build jobs: $BUILD_JOBS; build mode: $TOOLS_BUILD_MODE" >> "$GITHUB_STEP_SUMMARY"
          echo "Compilation cache exact hit: ${{ steps.cache.outputs.cache-hit == 'true' }}" >> "$GITHUB_STEP_SUMMARY"
          cache_dir="$RUNNER_TEMP/tools-cache"
          output_dir="$RUNNER_TEMP/tools-apk"
          mkdir -p "$cache_dir/downloads" "$cache_dir/cargo-target" "$output_dir"
          sudo chown -R 1000:1000 "$cache_dir" "$output_dir"
          docker run --rm \
            --env SDK_ARCH \
            --env PACKAGES_COMMIT \
            --env RUST_VERSION \
            --env TOOLS_BUILD_MODE \
            --env TOOLS_RUST_ROOT=/opt/rust \
            --env BUILD_JOBS \
            --env TOOLS_CARGO_TARGET_DIR=/cache/target \
            --mount "type=bind,source=$GITHUB_WORKSPACE/package,target=/feed,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/.github/scripts,target=/ci,readonly" \
            --mount "type=bind,source=$RUST_TOOLCHAIN_DIR,target=/opt/rust,readonly" \
            --mount "type=bind,source=$cache_dir/downloads,target=/builder/dl" \
            --mount "type=bind,source=$cache_dir/cargo-target,target=/cache/target" \
            --mount "type=bind,source=$output_dir,target=/out" \
            --workdir /builder --entrypoint /bin/bash \
            "$RESOLVED_SDK_IMAGE" /ci/build-sdk.sh
          echo "SDK build and checks: $((SECONDS - started))s" >> "$GITHUB_STEP_SUMMARY"

      - name: Restore cache ownership for the runner
        if: always()
        shell: bash
        run: |
          for directory in "$RUNNER_TEMP/tools-cache" "$RUNNER_TEMP/tools-apk"; do
            if [ -d "$directory" ]; then
              sudo chown -R "$(id -u):$(id -g)" "$directory"
            fi
          done

      - name: Save verified build cache before publishing
        if: success() && steps.build.outcome == 'success' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.temp }}/tools-cache/downloads
            ${{ runner.temp }}/tools-cache/cargo-target
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Checkout the built commit for publishing
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Commit APKs to build folder
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          APK_DIR: ${{ runner.temp }}/tools-apk
        run: |
          bash .github/scripts/publish-apks.sh
