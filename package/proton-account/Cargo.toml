[package]
name = "proton-account"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
base64 = "0.22"
libc = "0.2.189"
pvpnclient = { version = "~4.4.1", registry = "proton", features = ["local-agent"] }
muon = { version = "3", registry = "proton", default-features = false, features = ["transport-hyper", "lenient", "other-product", "unsealed", "login"] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52.3", features = ["rt", "net", "time", "io-util"] }
async-compat = "0.2.5"
futures = "0.3.32"
hickory-proto = { version = "=0.26.3", default-features = false, features = ["std"] }
time = { version = "=0.3.55", features = ["formatting", "parsing"] }
